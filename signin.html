<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | {{NAME}}</title>
  <meta name="description" content="Sign in to {{NAME}} with a one-time link sent to your email.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0c0f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0c0f'/%3E%3Cpath fill='%236b95ff' d='M6 6h8v8H6zM18 6h8v8h-8zM6 18h8v8H6zM18 18h4v4h-4zM24 24h2v2h-2z'/%3E%3C/svg%3E">
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <nav class="topbar-in" aria-label="Main">
      <a class="brand" href="/">{{NAME}}</a>
      <div class="nav-links"><a href="/">Make</a><a href="/#check">Check</a><a href="/faq.html">FAQ</a></div>
    </nav>
  </header>
  <main id="main" class="page">
    <div class="page-head"><h1 id="headline" class="hero-title"><span class="line">Sign in</span></h1></div>
    <form id="signin-form" class="card" novalidate>
      <label for="signin-email">Your email</label>
      <div class="pair pair-tight">
        <input id="signin-email" type="email" autocomplete="email" inputmode="email" required>
        <button type="submit" class="btn btn-primary">Email me a link</button>
      </div>
      <p class="hint">No password. We email you a link that signs you in. It works once, for 15 minutes.</p>
    </form>

    <div id="signin-finish" class="card" hidden>
      <p>Press the button to finish signing in on this device.</p>
      <div class="actions"><button type="button" id="signin-go" class="btn btn-primary">Sign in</button></div>
    </div>

    <p id="signin-msg" class="status" role="status"></p>
    <p id="signin-error" class="msg-error" role="alert"></p>
  </main>
  <footer class="foot">
    <p>{{NAME}} runs in your browser.</p>
    <p><a href="/faq.html">FAQ</a><a href="/about.html">About</a><a href="/privacy.html">Privacy</a></p>
  </footer>
</body>
</html>
